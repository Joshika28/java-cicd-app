apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: java-cicd-app
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: java-cicd-app
                port:
                  number: 8080